<section id="education" class="education-section">
  <div class="container">
    <h2 class="section-title">{{ ui.titleEducation }}</h2>
    
    <div class="education-grid">
      <article *ngFor="let item of educationData; let i = index; trackBy: trackByIndex" class="edu-card card fade-in delay-{{i + 1}}">
        <div class="edu-mark">
          <span>{{ i + 1 }}</span>
        </div>
        <div class="edu-content">
          <h3 class="degree">{{ item.degree }}</h3>
          <h4 class="institution">{{ item.institution }}</h4>
          <time class="period">{{ item.period }}</time>
          <p class="details">{{ item.details }}</p>
        </div>
      </article>
    </div>
  </div>
</section>
