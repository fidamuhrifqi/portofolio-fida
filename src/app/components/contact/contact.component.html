<section id="contact" class="contact-section">
  <div class="container text-center">
    <h2 class="section-title">{{ ui.titleContact }}</h2>
    <p class="contact-subtitle fade-in delay-1">{{ ui.subtitleContact }}</p>
    
    <div class="contact-links fade-in delay-2">
      <button type="button" (click)="copyEmail($event)" class="contact-item card" [class.copied]="emailCopied">
        <span class="contact-mark">{{ emailCopied ? 'OK' : 'EM' }}</span>
        <span class="contact-copy">
          <span class="contact-label">{{ emailCopied ? ui.btnCopied : ui.btnEmail }}</span>
          <span class="contact-detail">{{ contactData.email }}</span>
        </span>
      </button>
      
      <a [href]="contactData.linkedin" target="_blank" rel="noopener noreferrer" class="contact-item card">
        <span class="contact-mark">IN</span>
        <span class="contact-copy">
          <span class="contact-label">LinkedIn</span>
          <span class="contact-detail">fidamuhrifqi</span>
        </span>
      </a>
      
      <a [href]="contactData.github" target="_blank" rel="noopener noreferrer" class="contact-item card">
        <span class="contact-mark">GH</span>
        <span class="contact-copy">
          <span class="contact-label">GitHub</span>
          <span class="contact-detail">fidamuhrifqi</span>
        </span>
      </a>
    </div>
  </div>
</section>
