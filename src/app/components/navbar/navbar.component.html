<nav class="navbar" [class.menu-open]="isMenuOpen" aria-label="Primary navigation">
  <div class="nav-container">
    <a href="#hero" class="logo" (click)="scrollTo('hero', $event)" aria-label="Go to hero section">
      <span>Fida</span>
      <span class="logo-mark">.</span>
    </a>

    <div class="nav-links" [class.active]="isMenuOpen">
      <a href="#about" [class.active-link]="activeSection === 'about'" (click)="scrollTo('about', $event)">{{ ui.navAbout }}</a>
      <a href="#skills" [class.active-link]="activeSection === 'skills'" (click)="scrollTo('skills', $event)">{{ ui.navSkills }}</a>
      <a href="#experience" [class.active-link]="activeSection === 'experience'" (click)="scrollTo('experience', $event)">{{ ui.navExperience }}</a>
      <a href="#projects" [class.active-link]="activeSection === 'projects'" (click)="scrollTo('projects', $event)">{{ ui.navProjects }}</a>
      <a href="#education" [class.active-link]="activeSection === 'education'" (click)="scrollTo('education', $event)">{{ ui.titleEducation }}</a>
      <a href="#contact" [class.active-link]="activeSection === 'contact'" (click)="scrollTo('contact', $event)">{{ ui.navContact }}</a>
    </div>

    <div class="nav-controls">
      <button type="button" class="icon-btn language-btn" (click)="toggleLanguage()" aria-label="Toggle language">
        <span>{{ currentLang === 'en' ? 'EN' : 'ID' }}</span>
      </button>
      <button type="button" class="icon-btn theme-btn" (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Switch to light theme' : 'Switch to dark theme'">
        <span aria-hidden="true">{{ isDarkMode ? 'LT' : 'DK' }}</span>
      </button>

      <button type="button" class="mobile-menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" aria-label="Toggle menu">
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</nav>
